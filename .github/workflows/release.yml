name: release

on:
  push:
    branches: ["main"]

concurrency: ${{github.workflow}}-${{github.ref}} # prevents overlapping runs of same workflow on same branch

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write # needed for npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 0 means fetch all git history - 1 means fetch only the single latest commit

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registery-url: ""

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
